name: 'deploy to aws s3'
description: 'Deploy a static website to s3'
inputs:
  bucket:
    description: 'Name of the S3 bucket'
    required: true
  bucket-region:
    description: 'Region of the S3 bucket'
    required: false
    default: 'eu-north-1'
  dist-folder:
    description: 'Path to the distribution folder'
    required: true
outputs:
  deployed-url:
    description: 'URL of the deployed website'
runs:
  using: 'node24' 
  main: 'main.js'